# Branch: push to `uat` deploys the UAT Azure environment (path-based api/web).
#
# Flow: feature branch → PR → merge to `uat` → this workflow runs.
# Promote to production: merge `uat` → `main` (see deploy-prod.yml).
#   Secrets (OIDC — ask DevOps to configure federated credentials):
#     AZURE_CLIENT_ID
#     AZURE_TENANT_ID
#     AZURE_SUBSCRIPTION_ID
#   Variables:
#     ACR_NAME                    e.g. alisadventureuat
#     AZURE_RESOURCE_GROUP        e.g. rg-alis-adventure-uat
#     API_CONTAINER_APP_NAME      e.g. ca-alis-api-uat
#     WEB_CONTAINER_APP_NAME      e.g. ca-alis-web-uat
#     PUBLIC_URL                  e.g. https://uat.alisadventure.com (optional health check)
#     VITE_API_URL                leave empty when nginx proxies /api on same host
#     VITE_GOOGLE_CLIENT_ID
#     VITE_GOOGLE_MAPS_API_KEY    optional
#
# Database: Azure PostgreSQL — not deployed by this workflow.
# Schema today is applied on API startup (seed migrations). Add Alembic later.

name: Deploy UAT

on:
  push:
    branches: [uat]
    paths:
      - "backend/**"
      - "frontend/**"
      - "docker-compose.yml"
      - ".github/workflows/deploy-uat.yml"
  workflow_dispatch:
    inputs:
      deploy_api:
        description: Build & deploy API image
        type: boolean
        default: true
      deploy_web:
        description: Build & deploy Web image
        type: boolean
        default: true

concurrency:
  group: deploy-uat-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

env:
  ACR_LOGIN_SERVER: ${{ vars.ACR_NAME }}.azurecr.io
  IMAGE_TAG: ${{ github.sha }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.flags.outputs.api }}
      web: ${{ steps.flags.outputs.web }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        if: github.event_name != 'workflow_dispatch'
        id: filter
        with:
          filters: |
            api:
              - 'backend/**'
              - 'docker-compose.yml'
              - '.github/workflows/deploy-uat.yml'
            web:
              - 'frontend/**'
              - 'docker-compose.yml'
              - '.github/workflows/deploy-uat.yml'
      - id: flags
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "api=${{ inputs.deploy_api }}" >> "$GITHUB_OUTPUT"
            echo "web=${{ inputs.deploy_web }}" >> "$GITHUB_OUTPUT"
          else
            echo "api=${{ steps.filter.outputs.api }}" >> "$GITHUB_OUTPUT"
            echo "web=${{ steps.filter.outputs.web }}" >> "$GITHUB_OUTPUT"
          fi

  test-api:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Run tests
        env:
          SEED_DEMO_DATA: "false"
          REQUIRE_STRONG_ADMIN_SECRETS: "false"
          RATE_LIMIT_PER_MINUTE: "0"
        run: pytest -q

  test-web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
          VITE_GOOGLE_MAPS_API_KEY: ${{ vars.VITE_GOOGLE_MAPS_API_KEY }}
        run: npm run build

  build-deploy-api:
    needs: [changes, test-api]
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    environment: uat
    steps:
      - uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to ACR
        run: az acr login --name ${{ vars.ACR_NAME }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.ACR_LOGIN_SERVER }}/bookingsystem-api:${{ env.IMAGE_TAG }}
            ${{ env.ACR_LOGIN_SERVER }}/bookingsystem-api:uat-latest

      - name: Deploy API to Container App
        run: |
          az containerapp update \
            --name "${{ vars.API_CONTAINER_APP_NAME }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --image "${{ env.ACR_LOGIN_SERVER }}/bookingsystem-api:${{ env.IMAGE_TAG }}"

      - name: Verify API health
        run: |
          BASE="${{ vars.PUBLIC_URL }}"
          if [ -n "$BASE" ]; then
            URL="${BASE%/}/api/health"
          else
            FQDN=$(az containerapp show \
              --name "${{ vars.API_CONTAINER_APP_NAME }}" \
              --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
              --query "properties.configuration.ingress.fqdn" -o tsv)
            if [ -z "$FQDN" ]; then
              echo "No PUBLIC_URL or API ingress — skip health check."
              exit 0
            fi
            URL="https://${FQDN}/api/health"
          fi
          echo "Checking ${URL}"
          for i in 1 2 3 4 5; do
            if curl -fsS "$URL"; then
              exit 0
            fi
            sleep 15
          done
          echo "API health check failed"
          exit 1

  build-deploy-web:
    needs: [changes, test-web]
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    environment: uat
    steps:
      - uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to ACR
        run: az acr login --name ${{ vars.ACR_NAME }}

      - name: Build and push Web image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL }}
            VITE_GOOGLE_CLIENT_ID=${{ vars.VITE_GOOGLE_CLIENT_ID }}
            VITE_GOOGLE_MAPS_API_KEY=${{ vars.VITE_GOOGLE_MAPS_API_KEY }}
          tags: |
            ${{ env.ACR_LOGIN_SERVER }}/bookingsystem-web:${{ env.IMAGE_TAG }}
            ${{ env.ACR_LOGIN_SERVER }}/bookingsystem-web:uat-latest

      - name: Deploy Web to Container App
        run: |
          az containerapp update \
            --name "${{ vars.WEB_CONTAINER_APP_NAME }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --image "${{ env.ACR_LOGIN_SERVER }}/bookingsystem-web:${{ env.IMAGE_TAG }}"

      - name: Verify site health
        if: vars.PUBLIC_URL != ''
        run: |
          URL="${{ vars.PUBLIC_URL }}/api/health"
          echo "Checking ${URL}"
          for i in 1 2 3 4 5; do
            if curl -fsS "$URL"; then
              exit 0
            fi
            sleep 10
          done
          echo "Site health check failed"
          exit 1
